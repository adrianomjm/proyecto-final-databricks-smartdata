name: Deploy Pipeline to Databricks (DEV → PROD)

on:
  push:
    branches: [main]
    paths:
      - 'PrepAmb/**'
      - 'proceso/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  WORKSPACE_PATH: /Shared/proyectosmartdata/ETL

jobs:
  # ─────────────────────────────────────────────────────────
  # 1️⃣ DEPLOY A DEV
  # ─────────────────────────────────────────────────────────
  deploy-dev:
    name: 🟢 Deploy to DEV Workspace
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEV_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEV_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify CLI auth (DEV)
        run: databricks current-user me

      - name: Create workspace folder in DEV
        run: databricks workspace mkdirs "$WORKSPACE_PATH"

      - name: Sync PrepAmb notebook to DEV
        run: |
          databricks workspace import \
            --format SOURCE --language PYTHON --overwrite \
            --file "PrepAmb/1.Preparacion_Ambiente.py" \
            "$WORKSPACE_PATH/1.Preparacion_Ambiente"

      - name: Sync proceso notebooks to DEV
        run: |
          for nb in proceso/*.py; do
            name=$(basename "$nb" .py)
            echo "📤 Uploading $name to DEV..."
            databricks workspace import \
              --format SOURCE --language PYTHON --overwrite \
              --file "$nb" \
              "$WORKSPACE_PATH/$name"
          done

      - name: List deployed notebooks in DEV
        run: databricks workspace list "$WORKSPACE_PATH"

  # ─────────────────────────────────────────────────────────
  # 2️⃣ DEPLOY A PROD (solo si DEV pasó)
  # ─────────────────────────────────────────────────────────
  deploy-prod:
    name: 🔴 Deploy to PROD Workspace
    runs-on: ubuntu-latest
    needs: deploy-dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify CLI auth (PROD)
        run: databricks current-user me

      - name: Create workspace folder in PROD
        run: databricks workspace mkdirs "$WORKSPACE_PATH"

      - name: Sync PrepAmb notebook to PROD
        run: |
          databricks workspace import \
            --format SOURCE --language PYTHON --overwrite \
            --file "PrepAmb/1.Preparacion_Ambiente.py" \
            "$WORKSPACE_PATH/1.Preparacion_Ambiente"

      - name: Sync proceso notebooks to PROD
        run: |
          for nb in proceso/*.py; do
            name=$(basename "$nb" .py)
            echo "📤 Uploading $name to PROD..."
            databricks workspace import \
              --format SOURCE --language PYTHON --overwrite \
              --file "$nb" \
              "$WORKSPACE_PATH/$name"
          done

      - name: List deployed notebooks in PROD
        run: databricks workspace list "$WORKSPACE_PATH"

      - name: Deployment summary
        run: |
          echo "✅ Pipeline desplegado exitosamente DEV → PROD"
          echo "📁 Workspace path: $WORKSPACE_PATH"

  # ─────────────────────────────────────────────────────────
  # 3️⃣ EJECUTAR PIPELINE EN PROD (Preparación → Extract → Transform → Load → Grants)
  # ─────────────────────────────────────────────────────────
  run-pipeline-prod:
    name: 🎬 Run ETL Pipeline in PROD
    runs-on: ubuntu-latest
    needs: deploy-prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: 🎬 Execute Orchestrator (Prep → Extract → Transform → Load)
        run: |
          echo "🚀 Lanzando Orquestador en PROD..."
          databricks jobs submit --no-wait --json '{
            "run_name": "GitHub_Actions_ETL_Run",
            "tasks": [{
              "task_key": "run_orquestador",
              "notebook_task": {
                "notebook_path": "/Shared/proyectosmartdata/ETL/5.Orquestador",
                "base_parameters": {
                  "catalogo": "catalog_proyectosmartdata"
                }
              },
              "new_cluster": {
                "spark_version": "15.4.x-scala2.12",
                "node_type_id": "Standard_D4pds_v6",
                "num_workers": 0,
                "data_security_mode": "SINGLE_USER",
                "single_user_name": "ajuarezm88@gmail.com",
                "runtime_engine": "STANDARD",
                "spark_conf": {
                  "spark.databricks.cluster.profile": "singleNode",
                  "spark.master": "local[*]"
                },
                "custom_tags": {
                  "ResourceClass": "SingleNode"
                }
              },
              "timeout_seconds": 1800
            }]
          }' > submit_response.json
          
          RUN_ID=$(jq -r '.run_id' submit_response.json)
          echo "📋 Run ID: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: ⏳ Wait for ETL pipeline to complete
        run: |
          echo "Esperando a que termine el run $RUN_ID..."
          while true; do
            STATE=$(databricks jobs get-run $RUN_ID | jq -r '.state.life_cycle_state')
            RESULT=$(databricks jobs get-run $RUN_ID | jq -r '.state.result_state // "PENDING"')
            echo "Estado: $STATE | Resultado: $RESULT"
            
            if [ "$STATE" = "TERMINATED" ]; then
              if [ "$RESULT" = "SUCCESS" ]; then
                echo "✅ ETL Pipeline completado exitosamente"
                break
              else
                echo "❌ ETL Pipeline falló con resultado: $RESULT"
                exit 1
              fi
            elif [ "$STATE" = "INTERNAL_ERROR" ] || [ "$STATE" = "SKIPPED" ]; then
              echo "❌ ETL Pipeline en estado: $STATE"
              exit 1
            fi
            
            sleep 30
          done

      - name: 🔐 Pipeline summary
        run: |
          echo "═══════════════════════════════════════"
          echo "✅ PIPELINE CI/CD COMPLETO"
          echo "═══════════════════════════════════════"
          echo "1. ✅ Preparación Ambiente"
          echo "2. ✅ Extract (Ingest Movies + FilmDetails)"
          echo "3. ✅ Transform Silver"
          echo "4. ✅ Load Golden"
          echo "═══════════════════════════════════════"
          echo "📊 Workspace: ${{ secrets.DATABRICKS_PROD_HOST }}"
          echo "🆔 Run ID: $RUN_ID"
